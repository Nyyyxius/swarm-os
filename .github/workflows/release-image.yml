name: release-image

# Build and push the swarm-os image to the GitHub Container Registry (GHCR).
#
# Triggers:
#   - pushing a git tag like v0.1.0 → publishes :0.1.0 and :latest
#   - manual run (workflow_dispatch) → publishes :latest and :<short-sha>
#
# Image is published to ghcr.io/<owner>/<repo> (owner lowercased automatically).
# Consumers pull with a PAT that has read:packages — see docs/deploy/install.en.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only by default. To also publish arm64, set:
          #   platforms: linux/amd64,linux/arm64
          # NOTE: the arm64 leg cross-compiles the native modules
          # (better-sqlite3, node-pty) under QEMU emulation and is much slower.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
