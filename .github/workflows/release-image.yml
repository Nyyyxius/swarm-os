name: release-image

# Build and push the swarm-os image to the GitHub Container Registry (GHCR).
#
# Triggers:
#   - pushing a git tag like v0.1.0 → publishes :0.1.0 AND :latest, and cuts
#     the GitHub Release (auto-generated notes) the update checker reads.
#   - manual run (workflow_dispatch) → publishes :<short-sha> ONLY. It does
#     NOT move :latest: the `latest` tag below is gated on
#     `enable=${{ github.ref_type == 'tag' }}`, so a dispatch can never promote
#     an untagged build. (This comment used to claim otherwise — it was wrong.)
#
# Image is published to ghcr.io/<owner>/<repo> (owner lowercased automatically),
# as a multi-arch image (linux/amd64 + linux/arm64). The package is public:
# consumers `docker pull` it anonymously, no login.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # `write`, not `read`: the GitHub Release step below creates a release object
  # and asks the API to generate its notes. With `contents: read` that call
  # returns 403 and the whole job fails after having already pushed the image.
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 leg under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # One manifest list, both architectures, same tags. The Dockerfile
          # picks every arch-specific download from TARGETARCH (Claude Code
          # native build + its manifest checksum, VS Code CLI, uv). The arm64
          # leg runs under QEMU emulation — pnpm install, node-pty's node-gyp
          # compile and the tsc/vite build — so it is the slow half of this step.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the version + commit into the image so the running server can
          # report them on /info. Without these the image reports 'dev'.
          # On a tag push `meta.outputs.version` is the bare semver (v0.6.0 →
          # 0.6.0); on a workflow_dispatch it is `sha-<short>`, so a dispatch
          # build says out loud that it is not a release.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag pushes only — a workflow_dispatch has no tag to hang a release on.
      # `generate_release_notes` builds the body from the commits/PRs since the
      # PREVIOUS release, so the first release cut after a backlog of unpushed
      # tags will be large. That is correct behaviour, not a bug to work around.
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
