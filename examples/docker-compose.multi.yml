# swarm-os — multi-project docker-compose example.
#
# Two services run side by side, one container per project. Each one has its
# own state dir, its own host port (still on 127.0.0.1), and its own Discord
# webhook so notifications route to distinct channels. The host's `~/.claude`
# is shared as a RO mount — every container materialises its own writable
# copy at boot under /data/.claude-runtime/, so concurrent containers do NOT
# corrupt the host state (plan §13/§14).
#
# Usage:
#   1. Edit host paths + env vars below.
#   2. (Optional) export MY_PROJECT_DISCORD_WEBHOOK + MY_OTHER_PROJECT_DISCORD_WEBHOOK in
#      your shell or a .env file.
#   3. docker compose -f examples/docker-compose.multi.yml up -d
#
# Reach each instance from the host (or via Tailscale on its loopback):
#   - my-project      : http://127.0.0.1:8787
#   - my-other-project: http://127.0.0.1:8797

services:
  swarm-my-project:
    image: swarm-os:latest
    container_name: swarm-my-project
    init: true
    restart: unless-stopped
    # PTY comfort, NOT corruption insurance: `spawner.shutdownAll()` is
    # synchronous, so the 10s default SIGKILL truncates no intended DB write.
    # The extra time only lets the agent PTYs close cleanly on SIGTERM.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${HOME}/dev/my-project:/workspace
      - ${HOME}/.claude:/claude-source:ro
      # optional: lift theme/auth state from host (silences first-spawn
      # theme picker — see docker-compose.single.yml for details).
      - ${HOME}/.claude.json:/claude-source.json:ro
      - ${HOME}/.swarm-os/my-project:/data
    environment:
      SWARM_OS_PROJECT_NAME: my-project
      SWARM_OS_DISCORD_WEBHOOK_URL: ${MY_PROJECT_DISCORD_WEBHOOK:-}
      SWARM_OS_PUBLIC_URL: ${MY_PROJECT_PUBLIC_URL:-https://swarm.tail-xyz.ts.net:8787}
      # Update detection: OPTIONAL GitHub token (releases are read anonymously; a
      # token only raises the API rate limit). Both services read the SAME
      # variable — one token, one repository.
      SWARM_OS_GITHUB_TOKEN: ${SWARM_OS_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  swarm-my-other-project:
    image: swarm-os:latest
    container_name: swarm-my-other-project
    init: true
    restart: unless-stopped
    # Same rationale as the service above — PTY comfort, not corruption.
    stop_grace_period: 30s
    ports:
      # Distinct host port; the in-container port stays at 8787. Plan §13.
      - "127.0.0.1:8797:8787"
    volumes:
      - ${HOME}/dev/my-other-project:/workspace
      - ${HOME}/.claude:/claude-source:ro
      # optional: lift theme/auth state from host (silences first-spawn
      # theme picker — see docker-compose.single.yml for details).
      - ${HOME}/.claude.json:/claude-source.json:ro
      - ${HOME}/.swarm-os/my-other-project:/data
    environment:
      SWARM_OS_PROJECT_NAME: my-other-project
      SWARM_OS_DISCORD_WEBHOOK_URL: ${MY_OTHER_PROJECT_DISCORD_WEBHOOK:-}
      SWARM_OS_PUBLIC_URL: ${MY_OTHER_PROJECT_PUBLIC_URL:-https://swarm.tail-xyz.ts.net:8797}
      # Same optional token as the service above (see its comment).
      SWARM_OS_GITHUB_TOKEN: ${SWARM_OS_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
