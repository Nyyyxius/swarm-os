# swarm-os — third-party deployment compose, parameterised entirely by `.env`.
#
# Do NOT hardcode host-specific values here. Put them in `.env` — the guided
# installer writes it for you:
#     ./install.sh                 # wizard on first run, deploy afterwards
# or manually, exporting the env first so ${HOME} in paths is expanded:
#     set -a && source .env && set +a
#     docker compose -f examples/docker-compose.dist.yml up -d
#
# This file sets up the `local` agent transport (agents run inside the
# container). For `SWARM_OS_AGENT_TRANSPORT=ssh` — agents on the host, all four
# provider CLIs, one-click updates — layer the overlay on top:
#     docker compose -f examples/docker-compose.dist.yml \
#                    -f examples/docker-compose.ssh.yml up -d
# `install.sh` adds it automatically when the env file asks for ssh.
#
# The UI binds to the host loopback (127.0.0.1) only — there is no TLS inside
# the container. For remote access (Tailscale / reverse proxy / SSH tunnel) see
# docs/deploy/install.en.md.

services:
  swarm-os:
    image: ${SWARM_OS_IMAGE:-ghcr.io/nyyyxius/swarm-os:latest}
    container_name: ${SWARM_OS_CONTAINER_NAME:-swarm-os}
    # WHOSE processes these are on the host. The image's own `USER node` is
    # uid 1000 — the default here, so an .env that never heard of this key
    # behaves exactly as before. Set SWARM_OS_RUN_UID/GID (the installer writes
    # them) to run the server as another host account: then everything it
    # creates under ${DATA_PATH} and ${WORKSPACE_PATH} belongs to that account,
    # and the ${CLAUDE_DIR} mounted below can be ITS ~/.claude, 0700 and all.
    # Both halves must be set: uid alone would keep gid 1000 and lock the
    # container out of group-readable state.
    # NEVER 0 — the container must not run as root.
    user: "${SWARM_OS_RUN_UID:-1000}:${SWARM_OS_RUN_GID:-1000}"
    # init: true → Docker injects tini as PID 1 to reap zombies (the image also
    # has its own tini ENTRYPOINT; both layered is harmless and explicit).
    init: true
    restart: unless-stopped
    # PTY comfort, NOT corruption insurance: `spawner.shutdownAll()` is
    # synchronous, so the 10s default SIGKILL truncates no intended DB write.
    # The extra time only lets the agent PTYs close cleanly on SIGTERM.
    stop_grace_period: 30s
    ports:
      # Host loopback ONLY. Never write 0.0.0.0 here — remote access goes
      # through Tailscale / a reverse proxy / an SSH tunnel. The container
      # always listens on 8787 internally; only the host port is remappable.
      - "127.0.0.1:${SWARM_OS_PORT:-8787}:8787"
      # MCP port 8788 is INTENTIONALLY NOT mapped — intra-container only.
      # The VS Code web editor is NOT published either: `code serve-web` listens
      # on loopback inside the container and swarm-os reverse-proxies it under
      # /ide on THIS port, same origin. One ingress covers the whole product —
      # nothing to expose, nothing to give its own vhost, and a remote setup
      # that works for the UI works for the editor. `SWARM_OS_IDE_PORT` below is
      # the in-container port only; turn the editor off from the Plugins screen
      # (SWARM_OS_IDE_ENABLED only seeds that at first boot — see below).
    volumes:
      # The project the agents work in. RW.
      - ${WORKSPACE_PATH}:/workspace
      # Host ~/.claude credentials, RO. Boot-time copy lands at
      # /data/.claude-runtime; this RO mount is never written to.
      - ${CLAUDE_DIR}:/claude-source:ro
      # Claude theme/auth file, RO. Silences the first-spawn theme picker.
      - ${CLAUDE_JSON}:/claude-source.json:ro
      # Per-project state: SQLite db, token, hook-token, logs/, backups/,
      # .claude-runtime/. Persist this to keep teams + history across restarts.
      - ${DATA_PATH}:/data
    environment:
      # The home directory of the uid above, INSIDE the container. uid 1000 is
      # the image's `node` user and owns /home/node — the default, unchanged.
      # Any other uid has no passwd entry in the image: Docker would hand the
      # process HOME=/, and every npm fetch, plugin install and CLI that writes
      # under $HOME would fail on a read-only root. The installer points this at
      # /data/home, inside the one bind mount that account owns, and creates it.
      HOME: ${SWARM_OS_CONTAINER_HOME:-/home/node}
      SWARM_OS_PROJECT_NAME: ${SWARM_OS_PROJECT_NAME:-swarm-os}
      # Lets the container report its own image reference on `/info.image`.
      # Same variable as the `image:` key above (see .env.example) — passing it
      # through as an env var is the only way the process inside can read it;
      # OCI labels are not visible from within the container.
      SWARM_OS_IMAGE: ${SWARM_OS_IMAGE:-}
      # In-container port for `code serve-web` (proxied under /ide, see above).
      # Change it only if something else in the container already uses 8790.
      SWARM_OS_IDE_PORT: ${SWARM_OS_IDE_PORT:-8790}
      # First-boot SEED ONLY for the VS Code editor. After the first boot the DB is
      # the source of truth: enable/disable it from the Plugins screen (BUILT-IN
      # section, docs/builtin-features.md). Editing this later has no effect.
      SWARM_OS_IDE_ENABLED: ${SWARM_OS_IDE_ENABLED:-true}
      # Update detection: OPTIONAL GitHub token. The releases of the public
      # swarm-os repository are read anonymously; a token (any scope) only raises
      # the GitHub API rate limit. `environment:` is an explicit allow-list, so a
      # variable that is not named here never reaches the process no matter what
      # the .env says. Empty is the normal state.
      SWARM_OS_GITHUB_TOKEN: ${SWARM_OS_GITHUB_TOKEN:-}
      # Used for Discord embed deep-links (no token included).
      SWARM_OS_PUBLIC_URL: ${SWARM_OS_PUBLIC_URL:-}
      SWARM_OS_DISCORD_WEBHOOK_URL: ${SWARM_OS_DISCORD_WEBHOOK_URL:-}
      # Which CLI a team gets when neither the request nor the role names one.
      # claude|codex|gemini|opencode — validated at boot, an unknown value stops
      # the server rather than silently falling back.
      SWARM_OS_DEFAULT_PROVIDER: ${SWARM_OS_DEFAULT_PROVIDER:-claude}
      # Optional overrides (defaults shown).
      # EMPTY ON PURPOSE: unset, the instance default becomes the default model
      # OF THE DEFAULT PROVIDER, kept current from models.dev. A hardcoded
      # fallback here would hand every team a claude model id even on a codex or
      # gemini instance — a foreign id no downstream layer can catch.
      SWARM_OS_DEFAULT_MODEL: ${SWARM_OS_DEFAULT_MODEL:-}
      SWARM_OS_DEFAULT_EFFORT: ${SWARM_OS_DEFAULT_EFFORT:-xhigh}
      SWARM_OS_MAX_ORCHESTRATORS: ${SWARM_OS_MAX_ORCHESTRATORS:-10}
      SWARM_OS_MAX_WORKERS_PER_ORCH: ${SWARM_OS_MAX_WORKERS_PER_ORCH:-20}
      SWARM_OS_LOG_LEVEL: ${SWARM_OS_LOG_LEVEL:-info}
      # Dev/CI fallback only: the normal place for the OpenRouter key that
      # `opencode` agents need is SETTINGS ▸ OPENROUTER in the UI, and a key
      # stored there always wins over this one.
      SWARM_OS_OPENROUTER_API_KEY: ${SWARM_OS_OPENROUTER_API_KEY:-}
    healthcheck:
      # Always the in-container port (8787), independent of the host mapping.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
