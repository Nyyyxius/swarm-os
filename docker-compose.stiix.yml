# swarm-os — déploiement "stiix" (workspace: ~/projets/fyrel)
#
# Usage:
#   docker compose -f docker-compose.stiix.yml up -d
#   open http://127.0.0.1:8789
#
# Mounts:
#   /workspace     ← ~/projets/fyrel        (RW — agents work here)
#   /claude-source ← ~/.claude              (RO — used in local mode; SSH mode
#                                            keeps it only for the .claude.json
#                                            read in `_seedClaudeJsonTrust`)
#   /data          ← ~/.swarm-os/stiix      (SQLite, token, logs, mcp-runtime)
#   /host-ssh      ← ~/.ssh                 (RO — SSH key to reach the host)
#
# Transport: SWARM_OS_AGENT_TRANSPORT=ssh — claude runs on the host VM, not
# inside this container, so host + container can never race on
# ~/.claude/.credentials.json OAuth refresh.

services:
  swarm-os-stiix:
    image: swarm-os:latest
    container_name: swarm-os-stiix
    init: true
    restart: unless-stopped
    # PTY comfort, not corruption insurance — `shutdownAll()` is synchronous.
    # See docker-compose.test.yml for the full note.
    stop_grace_period: 30s
    ports:
      # Single ingress: the VS Code web editor is reverse-proxied under /ide on
      # this same port (mapped to container 8787), so no extra port is needed.
      - "127.0.0.1:8789:8787"
    extra_hosts:
      # Linux docker — host.docker.internal isn't resolved by default. Add a
      # gateway-mapped alias so the container can SSH back to the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/projets/fyrel:/workspace
      - ${HOME}/.claude:/claude-source:ro
      - ${HOME}/.claude.json:/claude-source.json:ro
      - ${HOME}/.swarm-os/stiix:/data
      - ${HOME}/.ssh:/host-ssh:ro
    environment:
      SWARM_OS_PROJECT_NAME: stiix
      SWARM_OS_PUBLIC_URL: https://vps-00b690bc.tail240b2d.ts.net:8789
      # MCP port — moved off the 8788 default ON PURPOSE. Under the ssh
      # transport each agent session opens `ssh -R <mcpPort>:127.0.0.1:<mcpPort>`
      # (agent-process.ts), which binds that port on the HOST loopback — it is
      # NOT a container-private port. Two swarm-os instances sharing an mcpPort
      # therefore fight over one host port, and `ExitOnForwardFailure=no` makes
      # the loser fail SILENTLY: its agents simply can't reach the MCP server,
      # with no error surfaced. This instance and `test` were both on 8788;
      # whichever opened a session first won. Host map today:
      #   8788 → test, 8790 → trader, 8794 → storyforge, 8796 → here.
      # Keep it distinct from SWARM_OS_IDE_PORT (8790 default) too: those two
      # share the container's loopback.
      SWARM_OS_MCP_PORT: 8796
      # SSH transport: claude runs on the host, container only orchestrates.
      SWARM_OS_AGENT_TRANSPORT: ssh
      SWARM_OS_SSH_TARGET: ubuntu@host.docker.internal
      SWARM_OS_SSH_KEY: /host-ssh/fyrel-dev-spawner
      SWARM_OS_HOST_DATA_DIR: ${HOME}/.swarm-os/stiix
      SWARM_OS_HOST_CLAUDE_DIR: ${HOME}/.claude
      # Multi-provider: one host config dir per agent CLI. These MUST be set
      # explicitly under the ssh transport — the default is derived from the
      # CONTAINER home (/home/node), so an unset variable makes the per-session
      # credential symlinks dangle and the agent fails on an auth error with no
      # dialog to show for it. Harmless when the CLI is not installed on the
      # host: the availability probe simply reports the provider unavailable.
      SWARM_OS_HOST_CODEX_DIR: ${HOME}/.codex
      SWARM_OS_HOST_GEMINI_DIR: ${HOME}/.gemini
      SWARM_OS_HOST_OPENCODE_DIR: ${HOME}/.config/opencode
      # gemini has no "use whatever works" auth mode and the container cannot
      # see the host's ~/.gemini, so the adapter defaults to `gemini-api-key`
      # (a failure visible in the PTY) rather than `oauth-personal` (a silent
      # authorization prompt). Set this when the host is logged in with Google.
      SWARM_OS_GEMINI_AUTH_TYPE: ${SWARM_OS_GEMINI_AUTH_TYPE:-}
      SWARM_OS_HOST_WORKSPACE_ROOT: ${HOME}/projets/fyrel
      # Update detection. `environment:` is an explicit allow-list: a variable
      # not named here never reaches the process, and the check stays stuck on
      # `no_token`. Read-only PAT, scope `contents:read` (the repo is private).
      SWARM_OS_GITHUB_TOKEN: ${SWARM_OS_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
